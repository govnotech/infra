<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#440044">
  <meta name="color-scheme" content="dark">
  <title>Hub — Govno Tech</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --accent: #f0f;
      --accent-dim: #c800c8;
      --accent-dark: #992299;
      --glass: rgba(255, 0, 255, 0.04);
      --glass-border: rgba(255, 0, 255, 0.14);
      --glass-hover: rgba(255, 0, 255, 0.08);
      --text: #f0e8f0;
      --text-dim: #9070a0;
      --radius: 14px;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a000a;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Subtle noise grain */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      background-size: 256px 256px;
      z-index: 0;
      pointer-events: none;
      opacity: 0.35;
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: clamp(2rem, 5vw, 4rem) clamp(1rem, 4vw, 2rem);
    }

    header {
      margin-bottom: clamp(2rem, 4vw, 3.5rem);
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--text);
    }

    h1 .brand {
      background: linear-gradient(135deg, #c8a0c8 0%, #a030a0 60%, #780078 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    h1 .sep {
      font-weight: 400;
      padding: 0 0.1em;
      color: #4a0a4a;
    }

    .tagline {
      margin-top: 0.5rem;
      color: var(--text-dim);
      font-size: clamp(0.8rem, 2vw, 0.95rem);
      letter-spacing: 0.02em;
    }

    .section-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--accent-dim);
      margin-bottom: 0.75rem;
      padding-left: 0.2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr));
      gap: 0.875rem;
      margin-bottom: 2.5rem;
    }

    .card {
      position: relative;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 1.25rem 1.375rem;
      text-decoration: none;
      color: inherit;
      display: block;
      transform-style: preserve-3d;
      transform: perspective(800px) rotateX(0deg) rotateY(0deg) scale(1);
      transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      will-change: transform;
      overflow: hidden;
    }

    /* Mouse-tracking spotlight within the card */
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle 100px at var(--mx, 50%) var(--my, 50%),
        rgba(255, 0, 255, 0.13) 0%,
        transparent 70%
      );
      border-radius: inherit;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    /* Top highlight edge */
    .card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-dim), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card:hover {
      background: var(--glass-hover);
      border-color: rgba(255, 0, 255, 0.28);
      box-shadow:
        0 0 0 1px rgba(255, 0, 255, 0.07),
        0 8px 32px rgba(200, 0, 200, 0.14),
        0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .card:hover::before { opacity: 1; }
    .card:hover::after  { opacity: 1; }

    .card-name {
      font-size: 0.975rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.2rem;
    }

    .card-host {
      font-size: 0.72rem;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      color: var(--accent-dark);
      margin-bottom: 0.55rem;
      letter-spacing: 0.01em;
    }

    .card-desc {
      font-size: 0.8rem;
      color: var(--text-dim);
      line-height: 1.5;
    }

    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem 1rem 3rem;
      font-size: 0.85rem;
    }

    footer a {
      color: #7a2a7a;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: color 0.2s ease;
    }

    footer a:hover {
      color: var(--accent-dim);
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <main>
    <header>
      <h1><span class="brand">Govno Tech</span><span class="sep">.</span>Hub</h1>
      <p class="tagline">Self-hosted services</p>
    </header>

    <p class="section-label">Layer 1 — Infrastructure</p>
    <div class="grid" id="grid-layer1"></div>

    <p class="section-label">Layer 2 — Services</p>
    <div class="grid" id="grid-layer2"></div>
  </main>

  <footer><a href="https://github.com/govnotech/infra" target="_blank" rel="noopener">github.com/govnotech/infra</a></footer>

  <script>
    /* ── Canvas background: cursor-tracking icon grid ── */
    (() => {
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');

      let W, H;
      let mouse = { x: -9999, y: -9999 };
      let focused = true;
      let icons = [];

      const spacing = 110;

      function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
        buildGrid();
      }

      function buildGrid() {
        icons = [];
        const cols = Math.ceil(W / spacing) + 1;
        const rows = Math.ceil(H / spacing) + 1;
        const offsetX = (W - (cols - 1) * spacing) / 2;
        const offsetY = (H - (rows - 1) * spacing) / 2;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            icons.push({ x: offsetX + c * spacing, y: offsetY + r * spacing, angle: -Math.PI / 2, targetAngle: -Math.PI / 2 });
          }
        }
      }

      window.addEventListener('resize', resize);
      resize();

      window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
      window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
      window.addEventListener('focus', () => { focused = true; });
      window.addEventListener('blur',  () => { focused = false; });

      function drawIcon(x, y, angle, alpha, r, g, b, size) {
        const s = size / 512;
        const cx = 256, cy = 256;
        ctx.save();
        ctx.translate(x + cx * s, y + cy * s);
        ctx.rotate(angle + Math.PI / 2);
        ctx.scale(s, s);
        ctx.translate(-cx, -cy);
        ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.moveTo(256, 63);
        ctx.lineTo(256, 33);
        ctx.moveTo(177, 143);
        ctx.bezierCurveTo(173, 133, 172, 124, 172, 113);
        ctx.bezierCurveTo(172, 69, 209, 32, 256, 32);
        ctx.bezierCurveTo(303, 32, 340, 69, 340, 113);
        ctx.bezierCurveTo(340, 124, 339, 134, 335, 143);
        ctx.bezierCurveTo(333, 150, 326, 151, 317, 151);
        ctx.lineTo(195, 151);
        ctx.bezierCurveTo(186, 151, 180, 150, 177, 143);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(178, 145);
        ctx.bezierCurveTo(169, 184, 165, 221, 167, 259);
        ctx.bezierCurveTo(169, 292, 176, 324, 186, 353);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(334, 145);
        ctx.bezierCurveTo(343, 184, 347, 221, 345, 259);
        ctx.bezierCurveTo(343, 292, 336, 324, 326, 353);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(171, 309);
        ctx.bezierCurveTo(130, 318, 103, 352, 103, 394);
        ctx.bezierCurveTo(103, 443, 143, 480, 192, 480);
        ctx.bezierCurveTo(210, 480, 226, 476, 239, 469);
        ctx.bezierCurveTo(250, 464, 263, 464, 274, 469);
        ctx.bezierCurveTo(288, 476, 304, 480, 322, 480);
        ctx.bezierCurveTo(371, 480, 409, 443, 409, 394);
        ctx.bezierCurveTo(409, 352, 382, 318, 341, 309);
        ctx.stroke();

        ctx.restore();
      }

      function shortAngleDist(from, to) {
        const diff = ((to - from + Math.PI) % (Math.PI * 2)) - Math.PI;
        return diff < -Math.PI ? diff + Math.PI * 2 : diff;
      }

      function animate() {
        ctx.clearRect(0, 0, W, H);

        for (const a of icons) {
          if (focused && mouse.x > -9000) {
            a.targetAngle = Math.atan2(mouse.y - a.y, mouse.x - a.x);
          } else {
            a.targetAngle = -Math.PI / 2;
          }

          a.angle += shortAngleDist(a.angle, a.targetAngle) * 0.08;

          const dx = mouse.x - a.x;
          const dy = mouse.y - a.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const proximity = focused ? Math.max(0, 1 - dist / 500) : 0;
          const alpha = 0.09 + proximity * 0.36;
          const channel = Math.round(40 + proximity * 140);

          drawIcon(a.x, a.y, a.angle, alpha, channel, 8, channel, 48);
        }

        requestAnimationFrame(animate);
      }

      animate();
    })();

    /* ── Service cards ── */
    (() => {
      const parts = location.hostname.split('.');
      const domain = parts.length > 2 ? parts.slice(1).join('.') : location.hostname;

      const layer1 = [
        { name: 'Traefik',      sub: 'traefik',     desc: 'Reverse proxy & TLS management' },
        { name: 'Vaultwarden',  sub: 'vaultwarden', desc: 'Password manager (Bitwarden-compatible)' },
        { name: 'Dozzle',       sub: 'dozzle',      desc: 'Real-time container log viewer' },
        { name: 'Netdata',      sub: 'netdata',     desc: 'Server & container metrics' },
        { name: 'Dockge',       sub: 'dockge',      desc: 'Compose stack manager' },
        { name: 'Uptime Kuma',  sub: 'uptime',      desc: 'Uptime monitoring & alerting' },
      ];

      const layer2 = [
        { name: 'n8n',            sub: 'n8n',   desc: 'Workflow automation & AI agent pipelines' },
        { name: 'n8n Webhooks',   sub: 'hooks', desc: 'Workflow webhook receiver' },
        { name: 'PocketBase',     sub: 'pb',    desc: 'Lightweight BaaS & SQLite admin UI' },
        { name: 'PocketBase API', sub: 'pb',    desc: 'Public API endpoint' },
      ];

      function buildCard(svc) {
        const host = `${svc.sub}.${domain}`;
        const a = document.createElement('a');
        a.className = 'card';
        a.href = `https://${host}`;
        a.innerHTML = `
          <div class="card-name">${svc.name}</div>
          <div class="card-host">${host}</div>
          <div class="card-desc">${svc.desc}</div>
        `;

        a.addEventListener('mousemove', e => {
          const rect = a.getBoundingClientRect();
          a.style.setProperty('--mx', ((e.clientX - rect.left) / rect.width * 100).toFixed(1) + '%');
          a.style.setProperty('--my', ((e.clientY - rect.top)  / rect.height * 100).toFixed(1) + '%');
          const cx = (e.clientX - rect.left) / rect.width  - 0.5;
          const cy = (e.clientY - rect.top)  / rect.height - 0.5;
          a.style.transform = `perspective(800px) rotateX(${(-cy * 10).toFixed(2)}deg) rotateY(${(cx * 10).toFixed(2)}deg) scale(1.02)`;
        });

        a.addEventListener('mouseleave', () => {
          a.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg) scale(1)';
        });

        return a;
      }

      document.getElementById('grid-layer1').append(...layer1.map(buildCard));
      document.getElementById('grid-layer2').append(...layer2.map(buildCard));
    })();
  </script>
</body>
</html>
